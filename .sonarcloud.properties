# SonarQube Cloud — Automatic Analysis lee ESTE archivo (.sonarcloud.properties),
# NO sonar-project.properties (ese solo lo usa el analisis por CI). Por eso las
# exclusiones de sonar-project.properties se ignoraban y seguia analizando los .sql.
#
# Mismo alcance: este repo es ESPEJO del servidor web (C:\inetpub\wwwroot\muhle-vct)
# + los scripts de entrega. La mayor parte NO es codigo que se escriba/mantenga aca:
#   - db/objetos/** = definiciones volcadas de la base (coinciden con el servidor;
#                     no se editan).
#   - css/**, js/**  = espejo de assets del servidor + librerias de terceros
#                      (sweetalert2, font-awesome, w3, y los vct-* grandes).
#   - **/*.sql       = scripts de entrega (CREATE OR ALTER que duplican los dumps).
# Analizarlos dispara duplicacion y falsos positivos de seguridad/fiabilidad que no
# se pueden "corregir" sin apartar el repo del servidor. Por eso se excluyen.
#
# Automatic Analysis respeta: sonar.sources, sonar.exclusions, sonar.inclusions,
# sonar.tests, sonar.test.exclusions/inclusions, sonar.sourceEncoding, sonar.cpd.exclusions.
# Toma efecto cuando este archivo esta en la rama por defecto (main).
sonar.exclusions=db/objetos/**,db/_dump/**,css/**,js/**,**/*.min.js,**/*.min.css,**/*.sql
sonar.cpd.exclusions=db/objetos/**,**/*.sql
